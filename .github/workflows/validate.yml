name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: homelab-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check changed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Test activation guards
        run: python3 -m unittest discover -s tests -v
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      - name: Check changed Nix formatting
        run: |
          nix develop --command nixfmt flake.nix systems/edge/configuration.nix systems/identity/configuration.nix systems/identity/immich.nix nix/packages/agent-vault.nix nix/packages/pi.nix systems/agent-vault/*.nix systems/pi/*.nix
          git diff --exit-code
      - name: Check flake outputs
        run: nix flake check --no-build
      - name: Validate infrastructure schemas
        run: |
          nix develop --command sh -ec '
            for root in platform systems/edge systems/identity systems/immich systems/webdav systems/inference systems/walter systems/agent-vault systems/pi; do
              tofu -chdir="$root" fmt -check -diff
              tofu -chdir="$root" init -backend=false -input=false -lockfile=readonly
              tofu -chdir="$root" validate
            done
          '
      - name: Evaluate identity and application module options
        run: |
          nix eval .#nixosConfigurations.identity.config.services.kanidm.provision --json > /dev/null
          nix eval .#nixosConfigurations.identity.config.services.kanidm.server.settings --json > /dev/null
          nix eval .#nixosConfigurations.identity.config.systemd.services.kanidm.unitConfig --json > /dev/null
          nix eval .#nixosConfigurations.immich.config.services.immich.settings --json > /dev/null
          nix eval .#nixosConfigurations.immich.config.services.postgresql.dataDir --json > /dev/null
          nix eval .#nixosConfigurations.immich.config.systemd.services.immich-server.unitConfig --json > /dev/null
          nix eval .#nixosConfigurations.immich.config.systemd.services.postgresql-setup.unitConfig --json > /dev/null
          nix eval .#nixosConfigurations.immich.config.services.immich.package.version --raw
          nix eval .#nixosConfigurations.webdav.config.services.webdav.settings --json > /dev/null
          nix eval .#nixosConfigurations.webdav.config.systemd.services.webdav.serviceConfig --json > /dev/null
          nix eval .#nixosConfigurations.agent-vault.config.systemd.services.agent-vault.serviceConfig --json > /dev/null
          nix eval '.#nixosConfigurations.pi.config.environment.etc."garden-agent/session.json".text' --raw > /dev/null
          nix eval .#nixosConfigurations.pi.config.nix.settings --json > /dev/null
          nix eval .#nixosConfigurations.pi.config.systemd.services.nix-daemon.serviceConfig --json > /dev/null
      - name: Check Pi CA mount in a Nix sandbox
        run: |
          ca_path="$(nix eval --raw .#nixosConfigurations.pi.config.nix.settings.extra-sandbox-paths --apply builtins.head)"
          nix build --no-link --option extra-sandbox-paths "$ca_path" --impure --expr '
            let
              garden = builtins.getFlake (toString ./.);
              pkgs = garden.inputs.nixpkgs.legacyPackages.x86_64-linux;
              ca = garden.nixosConfigurations.pi.config.security.pki.caBundle;
            in pkgs.runCommand "garden-pi-ca-mount-check" { } "test -r ${ca}; touch $out"
          '
      - name: Run focused native application checks
        run: |
          nix build --no-link \
            .#checks.x86_64-linux.caddy-config \
            .#checks.x86_64-linux.webdav-ingress \
            .#checks.x86_64-linux.webdav-accounts
