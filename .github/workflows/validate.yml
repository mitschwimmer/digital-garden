name: Fast static checks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: homelab-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Whitespace and shell syntax
        run: |
          git diff --check HEAD^ HEAD
          for script in scripts/*.sh; do bash -n "$script"; done
          sh -n llama/start.sh
      - name: Python syntax and lightweight declarative checks
        run: |
          python3 -m py_compile scripts/*.py tests/*.py
          python3 tests/test_configure_llama.py
          python3 tests/test_llama_config.py
