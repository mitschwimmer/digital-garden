# Public configuration only. Create these credential slots privately before
# applying; this does not create credentials or configure model endpoints.
services:
  - name: github-api
    host: api.github.com:443
    auth:
      type: bearer
      token: GITHUB_PAT
  - name: github-git
    host: github.com:443/mitschwimmer/*
    auth:
      type: basic
      username: GITHUB_USERNAME
      password: GITHUB_PAT

  - name: tensorx
    host: api.tensorx.ai:443/v1/*
    auth:
      type: bearer
      token: TENSORX_API_KEY

  - name: strata
    host: 192.168.1.28:8080/v1/*
    auth:
      type: bearer
      token: STRATA_API_KEY
