version = 1

; Router: launch with --models-max 1.
; Two profiles of the same GGUF, loaded one at a time.

[*]
model = /var/cache/llama/qwen38
model-url = https://huggingface.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/resolve/main/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf

; Hardware and inference
n-gpu-layers = all
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
batch-size = 512
ubatch-size = 128

; Server capabilities
jinja = true
no-webui = true
load-on-startup = false

; Speculative decoding
spec-type = draft-mtp
spec-draft-n-max = 2

; Agentic coding
[qwen38]
ctx-size = 65536
parallel = 1
mmproj-auto = false

; General chat and image recognition
[qwen38-chat]
ctx-size = 32768
parallel = 1
mmproj-auto = true
mmproj = /var/cache/llama/mmproj-Qwen3.8-27B-BF16.gguf
mmproj-url = https://huggingface.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/resolve/main/mmproj-Qwen3.8-27B-BF16.gguf
