version = 1

; Router launch: retain --models-max 1.
; These are two profiles of the same GGUF, loaded one at a time.
; Context sizes below are test targets, not yet validated VRAM limits.

[*]
model = /var/cache/llama/qwen38
model-url = https://huggingface.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/resolve/main/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
n-gpu-layers = all
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
batch-size = 512
ubatch-size = 128
jinja = true
no-webui = true
load-on-startup = false
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
repeat-penalty = 1.0
presence-penalty = 0.0
reasoning = auto
reasoning-format = deepseek
reasoning-budget = -1

; Agentic coding. Keep the existing API ID for our direct tests.
[qwen38]
ctx-size = 65536
parallel = 1
mmproj-auto = false
reasoning-effort = xhigh
chat-template-kwargs = {"preserve_thinking":true}

; General chat and image recognition.
; Request-level reasoning_effort: none, low, medium, or xhigh.
[qwen38-chat]
ctx-size = 32768
parallel = 1
mmproj-auto = true
mmproj = /var/cache/llama/mmproj-Qwen3.8-27B-BF16.gguf
mmproj-url = https://huggingface.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/resolve/main/mmproj-Qwen3.8-27B-BF16.gguf
reasoning-effort = medium
chat-template-kwargs = {"preserve_thinking":true}
