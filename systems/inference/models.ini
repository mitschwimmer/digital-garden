version = 1

; Router: launch with --models-max 1.
; Two profiles of the same GGUF, loaded one at a time.
; Keep existing client-facing aliases during the model transition.

[*]
model = /var/cache/llama/qwen36-35b-a3b-q4
model-url = https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/a483e9e/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf

; Hardware and inference
n-gpu-layers = all
n-cpu-moe = 20
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
batch-size = 512
ubatch-size = 128

; Server capabilities
jinja = true
no-webui = true
load-on-startup = false

; Speculative decoding disabled for initial quality comparison
spec-type = none

; Agentic coding
[qwen38]
ctx-size = 65536
parallel = 1
mmproj-auto = false

; General chat and image recognition
[qwen38-chat]
ctx-size = 32768
parallel = 1
mmproj-auto = true
mmproj = /var/cache/llama/mmproj-Qwen3.6-35B-A3B-BF16.gguf
mmproj-url = https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/a483e9e/mmproj-BF16.gguf

; Unsloth UD-Q5_K_M quality comparison (text-only)
[qwen36-q5]
model = /var/cache/llama/qwen36-35b-a3b-q5
model-url = https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/9280dd353ab587157920d5bd391ada414d84e552/Qwen3.6-35B-A3B-UD-Q5_K_M.gguf
ctx-size = 32768
parallel = 1
mmproj-auto = false

; Bartowski Qwen3.8 27B IQ3_XS dense quality comparison (text-only)
[qwen38-bartowski-iq3xs]
model = /var/cache/llama/qwen38-27b-bartowski-iq3xs
model-url = https://huggingface.co/bartowski/Qwen3.8-27B-GGUF/resolve/47ccbfdc07174a997da4505e45c9a45c1eb4d3e6/Qwen3.8-27B-IQ3_XS.gguf
; Dense architecture: disable the inherited MoE-specific CPU offload
n-cpu-moe = 0
ctx-size = 8192
parallel = 1
mmproj-auto = false
