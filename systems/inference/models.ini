version = 1


[*]
; Hardware and inference
; n-gpu-layers = all
; n-cpu-moe = 20
flash-attn = on
; cache-type-k = q8_0
; cache-type-v = q8_0
; batch-size = 512
; ubatch-size = 128

; Server capabilities
jinja = true
no-webui = true
load-on-startup = false

; Embedded MTP speculative decoding: begin with one draft token; measure ROCm throughput before raising
spec-type = draft-mtp
spec-draft-n-max = 1

; Do not carry reasoning traces from previous assistant turns
no-reasoning-preserve = true

[qwen38-chat]
model = /var/cache/llama/qwen38-27b-bartowski-iq3xs
model-url = https://huggingface.co/bartowski/Qwen3.8-27B-GGUF/resolve/47ccbfdc07174a997da4505e45c9a45c1eb4d3e6/Qwen3.8-27B-IQ3_XS.gguf
; Dense architecture: disable the inherited MoE-specific CPU offload
n-cpu-moe = 0
ctx-size = 8192
parallel = 1
mmproj-auto = false
mmproj = /var/cache/llama/mmproj-Qwen3.8-27B-bf16.gguf
mmproj-url = https://huggingface.co/bartowski/Qwen3.8-27B-GGUF/resolve/0c92138c51f112d2f0dc84d5f6d1ebe4b9912b9a/mmproj-Qwen3.8-27B-bf16.gguf
