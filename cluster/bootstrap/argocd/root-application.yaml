# One-time Kubernetes API bootstrap. NOT managed by the Argo CD chart.
# The live garden-root Application tracks main after the explicit revision
# handoff, and automatically reconciles the manual-sync child declarations.
# For recovery only, seed cluster/apps/root/project.yaml before this root
# if Argo CD Core has not yet created the garden AppProject.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garden-root
  namespace: argocd
spec:
  project: garden
  source:
    repoURL: https://github.com/mitschwimmer/digital-garden.git
    targetRevision: main
    path: cluster/apps/root
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
