# Based on ROCm/k8s-device-plugin at tag v1.31.0.10.
# Talos owns the amdgpu kernel driver; this DaemonSet only advertises amd.com/gpu.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amd-gpu-device-plugin
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amd-gpu-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: amd-gpu-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amd-gpu-device-plugin
    spec:
      serviceAccountName: amd-gpu-device-plugin
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      priorityClassName: system-node-critical
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      containers:
        - name: device-plugin
          image: rocm/k8s-device-plugin:1.31.0.10
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: sys
              mountPath: /sys
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
