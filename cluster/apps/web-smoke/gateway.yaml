# Cilium hostNetwork Gateway: public port 80 on the Talos node.
# Deliberately HTTP-only; an HTTPS listener and ACME issuer come later.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-smoke
  namespace: web-smoke
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      hostname: test.archaic.work
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-smoke
  namespace: web-smoke
spec:
  parentRefs:
    - name: web-smoke
      sectionName: http
  hostnames:
    - test.archaic.work
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web-smoke
          port: 8080
