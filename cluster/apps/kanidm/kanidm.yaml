# DISPOSABLE TEST ONLY. The domain is immutable and intentionally local.
# No ingress/HTTPRoute, OIDC clients, people, or service accounts are created.
apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: kanidm-test
  namespace: identity
spec:
  domain: idm.localhost
  origin: https://idm.localhost:8443
  image: kanidm/server:1.12.0
  tlsSecretName: kanidm-test-tls
  replicaGroups:
    - name: default
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 2Gi
  storage:
    volumeClaimTemplate:
      metadata: {}
      spec:
        storageClassName: nvme
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 389
    runAsGroup: 389
    fsGroup: 389
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: kanidm
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  initContainers:
    - name: kanidm-generate-replication-config
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
