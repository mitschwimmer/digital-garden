# REVIEW ONLY: do not activate until mount persistence and fail-closed
# provisioning have been tested on the single Talos node.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    openebs.io/cas-type: local
    cas.openebs.io/config: |
      - name: StorageType
        value: "hostpath"
      - name: BasePath
        value: "/var/mnt/k8s-data/openebs"
provisioner: openebs.io/local
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
