# STAGED / UNTESTED: Kubernetes v1.37 built-in admission, no webhook or extra controller.
# ApplyConfiguration cannot change atomic container command/args; use JSONPatch.
# Never reinvoke the append mutation to avoid duplicate injected containers.
# Mutation adds an initContainer only to OpenEBS Hostpath helper Pods.
# Unknown BasePath fails closed: /expected resolves to /var/mnt and the
# guard requires /data != /ephemeral, which cannot both pass.
# Test with kubectl server-side admission and a real disposable PVC BEFORE production.
# Never enable storage if mutation is absent. Does not guard arbitrary privileged pods.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: garden-openebs-mount-guard
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: openebs-hostpath-helper
      expression: >-
        request.namespace == "openebs"
        && has(object.spec.volumes)
        && object.spec.volumes.exists(v,
          v.name == "data" && has(v.hostPath))
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              volumes: [
                Object.spec.volumes{
                  name: "garden-ephemeral-reference",
                  hostPath: Object.spec.volumes.hostPath{
                    path: "/var/mnt",
                    type: "Directory"
                  }
                },
                Object.spec.volumes{
                  name: "garden-expected-volume",
                  hostPath: Object.spec.volumes.hostPath{
                    path: object.spec.volumes.filter(v, v.name == "data")[0].hostPath.path == "/var/mnt/k8s-data"
                      ? "/var/mnt/k8s-data"
                      : object.spec.volumes.filter(v, v.name == "data")[0].hostPath.path == "/var/mnt/k8s-nvme"
                        ? "/var/mnt/k8s-nvme"
                        : "/var/mnt",
                    type: "Directory"
                  }
                }
              ]
            }
          }
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.initContainers)
            ? [
                JSONPatch{
                  op: "add",
                  path: "/spec/initContainers/-",
                  value: Object.spec.initContainers{
                    name: "garden-mount-guard",
                    image: "docker.io/library/busybox:1.37.0",
                    command: ["/bin/sh", "-ec"],
                    args: [
                      'actual=$(stat -c %d /data); expected=$(stat -c %d /expected); ephemeral=$(stat -c %d /ephemeral); if [ "$actual" != "$expected" ] || [ "$actual" = "$ephemeral" ]; then echo OpenEBS_Hostpath_mount_not_verified >&2; exit 1; fi'
                    ],
                    securityContext: Object.spec.initContainers.securityContext{
                      runAsUser: 65534,
                      runAsNonRoot: true,
                      readOnlyRootFilesystem: true,
                      allowPrivilegeEscalation: false
                    },
                    volumeMounts: [
                      Object.spec.initContainers.volumeMounts{
                        name: "data",
                        mountPath: "/data",
                        readOnly: true
                      },
                      Object.spec.initContainers.volumeMounts{
                        name: "garden-expected-volume",
                        mountPath: "/expected",
                        readOnly: true
                      },
                      Object.spec.initContainers.volumeMounts{
                        name: "garden-ephemeral-reference",
                        mountPath: "/ephemeral",
                        readOnly: true
                      }
                    ]
                  }
                }
              ]
            : [
                JSONPatch{
                  op: "add",
                  path: "/spec/initContainers",
                  value: [Object.spec.initContainers{
                    name: "garden-mount-guard",
                    image: "docker.io/library/busybox:1.37.0",
                    command: ["/bin/sh", "-ec"],
                    args: [
                      'actual=$(stat -c %d /data); expected=$(stat -c %d /expected); ephemeral=$(stat -c %d /ephemeral); if [ "$actual" != "$expected" ] || [ "$actual" = "$ephemeral" ]; then echo OpenEBS_Hostpath_mount_not_verified >&2; exit 1; fi'
                    ],
                    securityContext: Object.spec.initContainers.securityContext{
                      runAsUser: 65534,
                      runAsNonRoot: true,
                      readOnlyRootFilesystem: true,
                      allowPrivilegeEscalation: false
                    },
                    volumeMounts: [
                      Object.spec.initContainers.volumeMounts{
                        name: "data",
                        mountPath: "/data",
                        readOnly: true
                      },
                      Object.spec.initContainers.volumeMounts{
                        name: "garden-expected-volume",
                        mountPath: "/expected",
                        readOnly: true
                      },
                      Object.spec.initContainers.volumeMounts{
                        name: "garden-ephemeral-reference",
                        mountPath: "/ephemeral",
                        readOnly: true
                      }
                    ]
                  }]
                }
              ]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: garden-openebs-mount-guard
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  policyName: garden-openebs-mount-guard
