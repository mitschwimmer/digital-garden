# Manual negative test ONLY; no Talos disk is unmounted or altered.
# Guard must fail its initContainer because /data is on EPHEMERAL.
# Inert main container does not write, even if admission is missing.
apiVersion: v1
kind: Pod
metadata:
  name: garden-guard-fallback-probe
  namespace: openebs
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: inert
      image: docker.io/library/busybox:1.37.0
      command: ["/bin/sh", "-ec", "echo only-admission-guard-test"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
  volumes:
    - name: data
      hostPath:
        path: /var/mnt
        type: Directory
