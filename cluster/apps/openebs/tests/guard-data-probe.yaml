# Manual test ONLY; not included in an Argo/Kustomize deployment.
# Admission must add garden-mount-guard. After policy is active and
# mounts verified, this probe should reach Succeeded without writing.
apiVersion: v1
kind: Pod
metadata:
  name: garden-guard-data-probe
  namespace: openebs
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: inert
      image: docker.io/library/busybox:1.37.0
      command: ["/bin/sh", "-ec", "echo only-admission-guard-test"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
  volumes:
    - name: data
      hostPath:
        path: /var/mnt/k8s-data
        type: Directory
