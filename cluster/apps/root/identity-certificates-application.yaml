# MANUAL SYNC ONLY. Run after cert-manager is healthy and CRDs/webhooks ready.
# This creates a disposable private CA and Kanidm certificate, not Kanidm.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-test-tls
  namespace: argocd
spec:
  project: garden
  source:
    repoURL: https://github.com/mitschwimmer/digital-garden.git
    targetRevision: main
    path: cluster/apps/identity-certificates
  destination:
    server: https://kubernetes.default.svc
    namespace: identity
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
