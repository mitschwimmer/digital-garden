apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: garden
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: In-cluster GitOps extensions and application workloads
  sourceRepos:
    - https://github.com/mitschwimmer/digital-garden.git
    - https://openebs.github.io/dynamic-localpv-provisioner
    - ghcr.io/pando85/helm-charts
    - quay.io/jetstack/charts
    - quay.io/cilium/charts
    - https://github.com/kubernetes-sigs/gateway-api.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: openebs
    - server: https://kubernetes.default.svc
      namespace: kube-system
    # Cilium Gateway's secret-sync Roles/RoleBindings live here.
    - server: https://kubernetes.default.svc
      namespace: cilium-secrets
    - server: https://kubernetes.default.svc
      namespace: kaniop
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: identity
    - server: https://kubernetes.default.svc
      namespace: web-smoke
  # Kaniop and cert-manager charts add CRDs and cluster-scoped RBAC;
  # cert-manager also adds admission webhook configurations.
  # Keep the allowlist explicit, and do not enable broad wildcard grants.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
    - group: gateway.networking.k8s.io
      kind: GatewayClass
    - group: scheduling.k8s.io
      kind: PriorityClass
    - group: storage.k8s.io
      kind: CSIDriver
    - group: networking.k8s.io
      kind: IngressClass
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: MutatingAdmissionPolicyBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
