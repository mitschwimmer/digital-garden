apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: garden
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: In-cluster GitOps extensions and application workloads
  sourceRepos:
    - https://github.com/mitschwimmer/digital-garden.git
    - https://openebs.github.io/dynamic-localpv-provisioner
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: openebs
    - server: https://kubernetes.default.svc
      namespace: kube-system
  # Existing cluster-scoped grants are for OpenEBS. AMD GPU plugin only
  # creates namespaced resources; no additional cluster-scoped grant needed.
  # Add further kinds only after inspecting their manifests.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: MutatingAdmissionPolicyBinding
