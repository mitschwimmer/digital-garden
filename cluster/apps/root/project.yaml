apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: garden
  namespace: argocd
spec:
  description: In-cluster GitOps extensions and application workloads
  # Only this repository is trusted. Add external Helm repositories
  # explicitly when approving a specific child Application.
  sourceRepos:
    - https://github.com/mitschwimmer/digital-garden.git
  # Initially permit only child Application objects in argocd.
  # Before activating the staged OpenEBS child, extend sourceRepos,
  # destinations and clusterResourceWhitelist for its reviewed Helm
  # repository, cluster-scoped kinds and openebs namespace. Not yet approved.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  # No clusterResourceWhitelist yet: fail closed until a child
  # platform extension requires reviewed cluster-scoped privileges.
