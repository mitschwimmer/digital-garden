# Pin upstream Gateway API CRDs and reconcile them with Argo CD.
# Experimental channel is required by pinned Cilium v1.20.4 (TLSRoute).
# No pruning: these cluster-wide definitions may have dependents.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  project: garden
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.3
    path: config/crd/experimental
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
