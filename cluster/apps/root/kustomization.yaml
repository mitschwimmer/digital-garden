apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The root auto-syncs AppProjects, repository declarations, namespaces
# and child Application objects. Every child is manual-sync only.
resources:
  - project.yaml
  - identity-namespace.yaml
  - kaniop-oci-repository.yaml
  - openebs-application.yaml
  - amd-gpu-application.yaml
  - kaniop-application.yaml
  - kanidm-test-application.yaml
  - cert-manager-oci-repository.yaml
  - cert-manager-application.yaml
  - identity-certificates-application.yaml
  - web-smoke-namespace.yaml
  - gateway-api-crds-application.yaml
  - cilium-oci-repository.yaml
  - cilium-platform-application.yaml
  - web-smoke-application.yaml
  - web-smoke-acme-staging-application.yaml
  - web-smoke-acme-production-application.yaml
  - web-smoke-https-application.yaml
