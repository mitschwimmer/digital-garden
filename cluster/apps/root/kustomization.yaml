apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The root auto-syncs AppProjects and child Application objects.
# Each child has NO automated sync, so installation requires manual approval.
# OpenEBS already passed provisioning acceptance; AMD GPU plugin is staged
# for device registration and a separate compute acceptance test.
resources:
  - project.yaml
  - openebs-application.yaml
  - amd-gpu-application.yaml
