apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The root auto-syncs. This child has NO automated sync policy.
# Before merging these changes into the branch watched by garden-root,
# verify test Pod and manual policy cleanup, mounted UserVolumes,
# namespace ownership, and all rendered Helm RBAC and manifests.
# The OpenEBS child will be CREATED by root but NOT synced automatically.
resources:
  - project.yaml
  - openebs-application.yaml
