apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Argo CD's small root Application owns child Applications and projects.
# Add a child Application here only after the underlying dependency is ready.
# OpenEBS stays excluded until both Talos mounts survive reboot and a
# missing-mount fail-closed guard has been validated; source is staged at
# openebs-application.yaml, but not reconciled by this root.
resources:
  - project.yaml
