# MANUAL SYNC ONLY. cert-manager v1.21.3 is not yet upstream-supported
# on this Kubernetes v1.37.1 cluster (upstream support: 1.33-1.36).
# Inspect rendered cluster-wide RBAC, webhook configurations and CRDs first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: garden
  source:
    repoURL: quay.io/jetstack/charts
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
          keep: true
        # Reconcile only after the Argo-managed v1.6.3 Gateway API CRDs
        # are established; enabling this changes the controller deployment.
        config:
          gatewayAPI:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
