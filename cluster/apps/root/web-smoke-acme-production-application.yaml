# MANUAL SYNC ONLY after staging Certificate succeeds.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-smoke-acme-production
  namespace: argocd
spec:
  project: garden
  source:
    repoURL: https://github.com/mitschwimmer/digital-garden.git
    targetRevision: main
    path: cluster/apps/web-smoke-acme-production
  destination:
    server: https://kubernetes.default.svc
    namespace: web-smoke
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
