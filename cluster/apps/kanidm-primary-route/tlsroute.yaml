# SNI-based TLS passthrough: browser talks TLS directly to Kanidm.
# This route does NOT decrypt or re-encrypt at Envoy.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: kanidm-primary
  namespace: identity
spec:
  parentRefs:
    - name: web-smoke-https
      namespace: web-smoke
      sectionName: kanidm
  hostnames:
    - auth.archaic.work
  rules:
    - backendRefs:
        - name: kanidm-primary
          port: 8443
